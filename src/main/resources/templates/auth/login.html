<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodingKit | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="auth-card shadow-lg">
        <div class="text-center mb-4">
            <div class="brand-badge"><i class="fa-solid fa-code"></i></div>
            <h2 class="brand-name">CodingKit</h2>
            <p class="tagline">Learn. Code. Practice. Grow.</p>
        </div>

        <div th:if="${successMessage != null}" class="alert alert-success">[[${successMessage}]]</div>
        <div th:if="${errorMessage != null}" class="alert alert-danger">[[${errorMessage}]]</div>
        <div th:if="${param.error != null}" class="alert alert-danger">Invalid username/email or password.</div>
        <div th:if="${param.logout != null}" class="alert alert-info">You have been logged out.</div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="mb-3">
                <label for="usernameOrEmail" class="form-label">Username or Email</label>
                <input type="text" class="form-control" id="usernameOrEmail" name="usernameOrEmail" placeholder="Enter your username or email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">
                <label class="form-check-label" for="rememberMe">Remember Me</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <div class="text-center mt-4 small text-muted">
            Don’t have an account? <a th:href="@{/register}">Create one</a>
        </div>
    </div>
</div>
</body>
</html>
