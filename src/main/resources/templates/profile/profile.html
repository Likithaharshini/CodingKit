<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="profile-page">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-3">
            <div class="brand-mark small-mark"><i class="fa-solid fa-code"></i></div>
            <h2 class="mb-0 page-title">Profile</h2>
        </div>
        <a th:href="@{/dashboard}" class="btn btn-primary">Back to Dashboard</a>
    </div>

    <div th:if="${successMessage != null}" class="alert alert-success">[[${successMessage}]]</div>
    <div th:if="${errorMessage != null}" class="alert alert-danger">[[${errorMessage}]]</div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card-panel">
                <div class="section-title">Account Details</div>
                <div class="profile-info">
                    <div><strong>Full Name:</strong> <span th:text="${user.fullName}">User</span></div>
                    <div><strong>Username:</strong> <span th:text="${user.username}">username</span></div>
                    <div><strong>Email:</strong> <span th:text="${user.email}">user@email.com</span></div>
                    <div><strong>Account Created:</strong> <span th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">date</span></div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card-panel">
                <div class="section-title">Edit Profile</div>
                <form th:action="@{/profile/update}" method="post" th:object="${profileUpdateRequest}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" th:field="*{fullName}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" th:field="*{username}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

    <div class="card-panel mt-4">
        <div class="section-title">Change Password</div>
        <form th:action="@{/profile/change-password}" method="post" th:object="${passwordChangeRequest}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Current Password</label>
                    <input type="password" class="form-control" th:field="*{currentPassword}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" th:field="*{newPassword}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" th:field="*{confirmPassword}" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Update Password</button>
        </form>
    </div>
</div>
</body>
</html>
