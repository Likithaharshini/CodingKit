<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="history-page">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-3">
            <div class="brand-mark small-mark"><i class="fa-solid fa-code"></i></div>
            <h2 class="page-title mb-0">Saved History</h2>
        </div>
        <a th:href="@{/dashboard}" class="btn btn-primary"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <div th:if="${successMessage != null}" class="alert alert-success">[[${successMessage}]]</div>
    <div th:if="${errorMessage != null}" class="alert alert-danger">[[${errorMessage}]]</div>

    <div class="history-panel mb-5">
        <div class="panel-header">Video History</div>
        <div class="row g-3" th:if="${history != null and !#lists.isEmpty(history)}">
            <div class="col-md-6 col-xl-4" th:each="entry : ${history}">
                <div class="history-card">
                    <div class="history-thumb">
                        <img th:src="@{'https://img.youtube.com/vi/' + ${entry.videoId} + '/hqdefault.jpg'}" alt="Video thumbnail">
                    </div>
                    <div class="history-info">
                        <h5 th:text="${entry.videoTitle}">Video title</h5>
                        <div class="small text-muted">[[${entry.videoUrl}]]</div>
                        <div class="small text-muted mt-2" th:text="${#temporals.format(entry.createdAt, 'yyyy-MM-dd HH:mm')}">Created</div>
                        <div class="history-actions mt-3">
                            <a th:href="@{'https://www.youtube.com/watch?v=' + ${entry.videoId}}" target="_blank" class="btn btn-primary btn-sm">Open</a>
                            <form th:action="@{'/history/delete-video/' + ${entry.id}}" method="post" style="display:inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Delete this video history record?')">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="empty-state" th:if="${history == null or #lists.isEmpty(history)}">
            No saved videos yet.
        </div>
    </div>

    <div class="history-panel">
        <div class="panel-header">Notes History</div>
        <div class="row g-3" th:if="${notes != null and !#lists.isEmpty(notes)}">
            <div class="col-md-6 col-xl-4" th:each="note : ${notes}">
                <div class="history-card mini-note-card">
                    <div class="note-head">
                        <strong th:text="${note.title}">Note title</strong>
                    </div>
                    <p th:text="${note.content}">Note content</p>
                    <div class="small text-muted" th:text="${#temporals.format(note.updatedAt, 'yyyy-MM-dd HH:mm')}">Updated</div>
                    <div class="history-actions mt-3">
                        <a th:href="@{/dashboard}" class="btn btn-primary btn-sm">Open</a>
                        <form th:action="@{'/history/delete-note/' + ${note.id}}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Delete this note?')">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="empty-state" th:if="${notes == null or #lists.isEmpty(notes)}">
            No notes saved yet.
        </div>
    </div>
</div>
</body>
</html>
